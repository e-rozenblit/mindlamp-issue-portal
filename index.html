<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mindLAMP Issue Portal</title>
<style>
  :root { --bg: #f5f6f7; --ink: #17202a; --muted: #55616d; --line: #d9dee3; --surface: #fff; --accent: #1f5f8b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11181d; --ink: #e8edf1; --muted: #a3afba; --line: #2c3740; --surface: #182128; --accent: #7db4dc; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 12vh auto 0; padding: 0 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 8px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>mindLAMP Issue Portal</h1>
    <p>The portal is offline for now while we rework it.</p>
    <p>Questions or problems: <a href="mailto:mindlamp@bidmc.harvard.edu">mindlamp@bidmc.harvard.edu</a></p>
  </div>
</main>
</body>
</html>
